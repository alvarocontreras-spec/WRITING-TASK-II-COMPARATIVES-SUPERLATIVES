<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing Task II : Comparatives & Superlatives</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2d572c;
      --primary-hover: #1e3d1e;
      --text: #2c3e50;
      --success: #27ae60;
      --error: #e74c3c;
      --border: #dcdde1;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      max-width: 850px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.95em;
      margin-bottom: 20px;
    }
    .user-info-card {
      background: #eef2f7;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 25px;
    }
    .user-info-card h3 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.1em;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .form-control {
      flex: 1;
      min-width: 200px;
    }
    .form-control label {
      display: block;
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 5px;
      color: #34495e;
    }
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 0.95em;
      background: white;
      outline: none;
    }
    select:focus {
      border-color: var(--primary);
    }
    .image-container {
      text-align: center;
      margin-bottom: 30px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .slot-card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .slot-title {
      font-weight: bold;
      color: var(--primary);
      font-size: 1.05em;
    }
    .prompt-desc {
      font-size: 0.95em;
      margin-bottom: 12px;
      color: #34495e;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .btn-check, .btn-download {
      margin-top: 10px;
      padding: 10px 18px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9em;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn-check:hover, .btn-download:hover {
      background-color: var(--primary-hover);
    }
    .feedback-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9em;
      display: none;
    }
    .feedback-box.success {
      background-color: #e8f8f0;
      color: var(--success);
      border: 1px solid #abebc6;
    }
    .feedback-box.error {
      background-color: #fadbd8;
      color: var(--error);
      border: 1px solid #f5b7b1;
    }
    .checklist {
      margin: 5px 0 0 0;
      padding-left: 20px;
    }
    .download-section {
      background: #eef2f7;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-top: 30px;
      border: 1px solid var(--border);
    }
    .btn-download {
      font-size: 1.1em;
      padding: 14px 25px;
      background-color: #27ae60;
    }
    .btn-download:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Writing Task II : Comparatives & Superlatives</h1>
  <p class="subtitle">Select your course and name, write full sentences in each slot, and check your grammar structure.</p>

  <!-- STUDENT SELECTION FORM -->
  <div class="user-info-card">
    <h3>Student Information</h3>
    <div class="form-group">
      <div class="form-control">
        <label for="course-select">Select Course:</label>
        <select id="course-select" onchange="updateStudentList()">
          <option value="">-- Choose Course --</option>
          <option value="5thA">5th Grade A</option>
          <option value="5thB">5th Grade B</option>
          <option value="5thC">5th Grade C</option>
        </select>
      </div>
      <div class="form-control">
        <label for="student-select">Select Your Name:</label>
        <select id="student-select" disabled>
          <option value="">-- Select Course First --</option>
        </select>
      </div>
    </div>
  </div>

  <!-- POSTER IMAGE -->
  <div class="image-container">
    <img src="imagen.png" alt="Comparatives and Superlatives Poster">
  </div>

  <!-- SLOTS -->
  <div id="slots-container"></div>

  <!-- DOWNLOAD SECTION -->
  <div class="download-section">
    <h3>Finished your task?</h3>
    <p style="font-size: 0.9em; color: #555; margin-bottom: 15px;">Download your text file and upload it directly to Google Classroom.</p>
    <button class="btn-download" onclick="downloadTXT()">📥 Download My Work (.txt)</button>
  </div>
</div>

<script>
  const students = {
    "5thA": ["ARANEDA SEPÚLVEDA MATÍAS SANTIAGO", "AYALA OLIVARES MÁXIMO ALONSO", "CAMPUSANO PÉREZ ISIDORA MONTSERRAT", "CANESSA VEGA BERNARDO FRANCISCO", "CARRASCO RAMÍREZ JAVIERA PAZ", "CHAMORRO SAN MARTÍN SEBASTIÁN FRANCISCO", "CORREA LEAL SANTIAGO LEÓN", "CUKIC LUENGO BRUNO EDUARDO", "ESPINOZA OLIVARES LUCAS ALEJANDRO", "FERNÁNDEZ ESCOBAR MARTÍN FELIPE", "FERNÁNDEZ RODRIGUEZ FERNANDA NICOLE", "GARNIER VELÁSQUEZ MAXIMILIANO LORENZO", "GARZON MACUER AMANDA SOFÍA", "GONZÁLEZ ARRIAGADA SOFÍA ISIDORA", "IBARRA BARRAZA DOMINGA PAZ", "JARAMILLO CANALES JULIETA ANTONIA", "JIMÉNEZ MONSALVES FERNANDA PAZ", "MACUADA GONZÁLEZ TOMÁS ALONSO", "MEZA MISTO FRANCISCA IGNACIA", "MUÑOZ OLIVOS SOFÍA ANTONIA", "NECULQUEO MURA JAVIER MATIAS", "OSORIO MUÑOZ LUCIANO", "PARRA ALIAGA AGUSTÍN CLEMENTE LEÓN", "RIQUELME CONTRERAS JULIETA ISADORA", "SALINAS SAAVEDRA EMILIANO IGNACIO", "SÁNCHEZ MORAGA NICOLÁS ARTURO", "SEISDEDOS CARVAJAL ANGELA GUADALUPE", "SEREY VALDES RENATO CLEMENTE", "SEYMOUR REYES TRINIDAD EMILIA", "VALLEJOS NAVARRO JOSEFA AGUSTINA", "VELOSO MUÑOZ ISABELLA AMARAL", "VERGARA FUENZALIDA JOAQUÍN IGNACIO", "VERGARA MARÍN DAMIÁN ALONSO", "VINES ZÚÑIGA DAMIÁN ALBERTO", "ZURITA BUSTOS ANTONIA INÉS"],
    "5thB": ["ACUÑA ALARCÓN DOMINGO", "AGUILAR MENARES VALENTÍN IGNACIO", "ALLENDE GARAY ALFONSO ERNESTO", "ARA CAMPUSANO VALENTINA ANTONIA", "ARAYA ESCALONA JOSE MANUEL", "ÁVILA RAMÍREZ AMANDA", "BOBADILLA PONCE VICENTE IGNACIO", "CASTILLO CARVAJAL TRINIDAD PAZ", "CONTRERAS RAMOS AMANDA BELÉN", "DÍAZ CORTÉS NICOLÁS IGNACIO", "DURÁN FREZ FLORENCIA CATALINA", "FARÍAS VALENZUELA REBECCA ESPERANZA", "GARRIDO DONOSO AMANDA", "GÓMEZ BURGOS ROSARIO BELÉN", "GONZÁLEZ ESPINOZA ARANTZA MICAELA", "HOLZMANN CÁRCAMO ANTONIA IGNACIA", "LAZO DÍAZ RENATA ANDREA", "LÓPEZ OJEDA AGUSTÍN SANTIAGO", "MENESES MADARIAGA GASPAR BAUTISTA", "MORAGA MARTINEZ VICTORIA ESPERANZA", "MOSQUEIRA VALDIVIA CAMILO ANDRÉS", "ORMEÑO LACHR PEDRO JOAQUIN", "OSORNO ARRIAGADA AMANDA MARIANNE", "PARRA PIMENTEL CONSUELO EMILIA", "REYES MARCHANT EMILIANO BAUTISTA", "RIVERA SAAVEDRA DIEGO ANDRÉS", "ROMÁN PEÑA GUSTAVO EMILIO", "RUIZ GARCÍA SANTIAGO ALONSO", "RUZ REYES MATÍAS ALEJANDRO", "SARRIA ASTUDILLO EVA MAGDALENA", "TRUJILLO BURGOS SANTIAGO ALONSO", "URQUEJO CHACANO RAFAELA", "VALENZUELA GONZÁLEZ JOSÉ MIGUEL", "VÁSQUEZ TAPIA SOFÍA ANTONIA", "VILLANUEVA SIMON GASPAR ALBERTO", "ZAMORA TORRES FACUNDO AGUSTÍN"],
    "5thC": ["ABURTO FUENTEALBA IGNACIO ANDRÉS", "ÁGUILA MOSCOSO LÍA ISABELLA", "ALBORNOZ IBARRA LAURA ALEJANDRA", "ALEGRÍA RAMÍREZ JAVIERA IGNACIA", "APIOLAZA SCACCHI DIEGO ALEJANDRO", "BRANTE CATAFAU RAFAEL BAUTISTA", "BRUNAUD GALLARDO MARIA FERNANDA", "CADIU MELLA MAXIMILIANO IGNACIO", "CANTO MORAGA FELIPE", "CASTILLO MORALES VICENTE SALVADOR", "CASTRO CEPEDA RENATO", "CAVIERES PASMIÑO ROSARIO ISABEL", "CEPEDA PEDREROS CAMILO IGNACIO", "CONTRERAS CÁRDENAS JOSEFA IGNACIA", "CERDA OSSES RAFAEL ORLANDO", "CORTÉS JARA EMMA VALENTINA", "FECCI DUARTE GASPAR OLIVER", "FERNÁNDEZ SALINAS RAFAELA ANHAIS", "GARCÍA ANDRADE MAITE CELESTE", "GONZÁLEZ HERNÁNDEZ AGUSTINA PAZ", "GONZÁLEZ YÁÑEZ LUCIANO ALONSO", "HENRÍQUEZ LÓPEZ ANTONIO MIGUEL", "MORALES MORIS BERNARDO LEON", "MUÑOZ LEÓN MATILDE IGNACIA", "PAVEZ KNUST PEDRO ENRIQUE", "PIZARRO PAREDES ALONSO GABRIEL", "QUINTEROS MONDIGLIO LEONOR IGNACIA", "QUIROZ PÉREZ RAMIRO AGUSTÍN", "REYES BICHARA FRANCO FARID", "REYES CAÑAS JOAQUÍN ALEJANDRO", "RIQUELME ZÚÑIGA ISIDORA PAZ", "SALAZAR BELMAR AGUSTÍN ALONSO", "SANTOS ALVAREZ MIA SOPHIA", "TOBAR GONZÁLEZ FLORENCIA AYLIN", "VALENZUELA GONZÁLEZ GABRIEL IGNACIO", "VALLE FUENTES ELISA"]
  };

  const slotsData = [
    // COMPARATIVES
    { id: 1, type: "comparative", desc: "Compare the motorbike and the bicycle.", reqAdj: ["faster than", "more expensive than", "bigger than"] },
    { id: 2, type: "comparative", desc: "Compare simple math (2+3) with complex algebra.", reqAdj: ["easier than", "simpler than"] },
    { id: 3, type: "comparative", desc: "Compare rugby and table tennis.", reqAdj: ["more dangerous than", "harder than", "more difficult than"] },
    { id: 4, type: "comparative", desc: "Compare the big blue backpack and the small purple backpack.", reqAdj: ["heavier than", "bigger than", "larger than"] },
    { id: 5, type: "comparative", desc: "Compare the main swimming pool and the inflatable pool.", reqAdj: ["bigger than", "deeper than", "larger than"] },
    
    // SUPERLATIVES
    { id: 6, type: "superlative", desc: "Describe football compared to the other sports.", reqAdj: ["the most exciting", "the most popular", "the best"] },
    { id: 7, type: "superlative", desc: "Describe the stone castle compared to the other buildings.", reqAdj: ["the oldest", "the tallest", "the most ancient"] },
    { id: 8, type: "superlative", desc: "Describe the player with the gold trophy in the middle.", reqAdj: ["the best", "the happiest", "the winner"] },
    { id: 9, type: "superlative", desc: "Describe Team C (0-5) compared to the other teams.", reqAdj: ["the worst", "the saddest"] },
    { id: 10, type: "superlative", desc: "Describe Island A in relation to the house.", reqAdj: ["the farthest", "the furthest", "the smallest"] }
  ];

  function updateStudentList() {
    const courseSelect = document.getElementById('course-select');
    const studentSelect = document.getElementById('student-select');
    const selectedCourse = courseSelect.value;

    studentSelect.innerHTML = '';

    if (selectedCourse && students[selectedCourse]) {
      studentSelect.disabled = false;
      
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.innerText = '-- Select Your Name --';
      studentSelect.appendChild(defaultOption);

      students[selectedCourse].forEach(student => {
        const option = document.createElement('option');
        option.value = student;
        option.innerText = student;
        studentSelect.appendChild(option);
      });
    } else {
      studentSelect.disabled = true;
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.innerText = '-- Select Course First --';
      studentSelect.appendChild(defaultOption);
    }
  }

  function renderSlots() {
    const container = document.getElementById('slots-container');
    slotsData.forEach(slot => {
      const card = document.createElement('div');
      card.className = 'slot-card';
      card.innerHTML = `
        <div class="slot-header">
          <span class="slot-title">Slot ${slot.id}: ${slot.type.toUpperCase()}</span>
        </div>
        <p class="prompt-desc">${slot.desc}</p>
        <input type="text" id="input-${slot.id}" placeholder="Type your full sentence here..." autocomplete="off">
        <button class="btn-check" onclick="checkGrammar(${slot.id})">Check Grammar</button>
        <div class="feedback-box" id="feedback-${slot.id}"></div>
      `;
      container.appendChild(card);
    });
  }

  function checkGrammar(id) {
    const slot = slotsData.find(s => s.id === id);
    const text = document.getElementById(`input-${id}`).value.trim();
    const feedbackEl = document.getElementById(`feedback-${id}`);
    
    feedbackEl.style.display = 'block';
    
    if (!text) {
      feedbackEl.className = 'feedback-box error';
      feedbackEl.innerHTML = '⚠️ Please write a sentence before checking.';
      return false;
    }

    const textLower = text.toLowerCase();

    // Validations
    const hasToBe = /\b(is|are|was|were)\b/.test(textLower);
    const hasTargetAdj = slot.reqAdj.some(adj => textLower.includes(adj));
    
    let hasStructure = false;
    if (slot.type === "comparative") {
      hasStructure = textLower.includes("than");
    } else if (slot.type === "superlative") {
      hasStructure = textLower.includes("the");
    }

    let checks = [];
    
    if (hasToBe) {
      checks.push("✔️ Verb 'to be' (is/are) detected.");
    } else {
      checks.push("❌ Missing Verb 'to be' (use 'is' or 'are').");
    }

    if (hasTargetAdj) {
      checks.push(`✔️ Correct ${slot.type} adjective form used.`);
    } else {
      checks.push(`❌ Missing or incorrect ${slot.type} adjective.`);
    }

    if (slot.type === "comparative" && !textLower.includes("than")) {
      checks.push("❌ Missing comparative connector 'than'.");
    }
    if (slot.type === "superlative" && !textLower.includes("the")) {
      checks.push("❌ Missing article 'the' before superlative.");
    }

    const isFullyCorrect = hasToBe && hasTargetAdj && hasStructure;

    if (isFullyCorrect) {
      feedbackEl.className = 'feedback-box success';
      feedbackEl.innerHTML = `<strong>🎉 Excellent sentence! All components detected:</strong><ul class="checklist">${checks.map(c => `<li>${c}</li>`).join('')}</ul>`;
    } else {
      feedbackEl.className = 'feedback-box error';
      feedbackEl.innerHTML = `<strong>⚠️ Grammar incomplete. Check your structure:</strong><ul class="checklist">${checks.map(c => `<li>${c}</li>`).join('')}</ul>`;
    }

    return isFullyCorrect;
  }

  function downloadTXT() {
    const course = document.getElementById('course-select').value;
    const student = document.getElementById('student-select').value;

    if (!course || !student) {
      alert("⚠️ Please select your Course and Name at the top before downloading!");
      return;
    }

    let content = `==========================================\n`;
    content += `WRITING TASK II : COMPARATIVES & SUPERLATIVES\n`;
    content += `==========================================\n`;
    content += `Student: ${student}\n`;
    content += `Course:  ${course}\n`;
    content += `Date:    ${new Date().toLocaleDateString()}\n`;
    content += `==========================================\n\n`;

    let allCompleted = true;

    slotsData.forEach(slot => {
      const sentence = document.getElementById(`input-${slot.id}`).value.trim();
      if (!sentence) allCompleted = false;

      content += `SLOT ${slot.id} (${slot.type.toUpperCase()}):\n`;
      content += `Prompt: ${slot.desc}\n`;
      content += `Sentence: ${sentence || "[NOT ANSWERED]"}\n\n`;
    });

    if (!allCompleted) {
      if (!confirm("You have some unanswered slots. Do you still want to download your file?")) {
        return;
      }
    }

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${course}_${student.replace(/\s+/g, '_')}_WritingTaskII.txt`;
    link.click();
  }

  renderSlots();
</script>

</body>
</html>
