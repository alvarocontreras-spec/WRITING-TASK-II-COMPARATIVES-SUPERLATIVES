<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Grammar Checker: Comparatives & Superlatives</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a6fa5;
      --primary-hover: #3b5984;
      --text: #2c3e50;
      --success: #27ae60;
      --error: #e74c3c;
      --warning: #f39c12;
      --border: #e0e0e0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      max-width: 800px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.95em;
      margin-bottom: 25px;
    }
    .slot-card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .slot-title {
      font-weight: bold;
      color: var(--primary);
      font-size: 1.1em;
    }
    .target-adj {
      background: #eef2f7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
      color: #555;
    }
    .prompt-desc {
      font-size: 0.95em;
      margin-bottom: 12px;
      color: #34495e;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .btn-check {
      margin-top: 10px;
      padding: 10px 18px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9em;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn-check:hover {
      background-color: var(--primary-hover);
    }
    .feedback-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9em;
      display: none;
    }
    .feedback-box.success {
      background-color: #e8f8f0;
      color: var(--success);
      border: 1px solid #abebc6;
    }
    .feedback-box.error {
      background-color: #fadbd8;
      color: var(--error);
      border: 1px solid #f5b7b1;
    }
    .checklist {
      margin: 5px 0 0 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Interactive Grammar Lab</h1>
  <p class="subtitle">Look at the poster images, write full sentences, and verify your grammar components.</p>

  <div id="slots-container"></div>
</div>

<script>
  const slotsData = [
    // COMPARATIVES
    { id: 1, type: "comparative", target: "FASTER", desc: "Compare the motorbike and the bicycle.", adjType: "short", reqAdj: ["faster than"] },
    { id: 2, type: "comparative", target: "EASIER", desc: "Compare simple math (2+3) with complex algebra.", adjType: "short", reqAdj: ["easier than"] },
    { id: 3, type: "comparative", target: "MORE DANGEROUS", desc: "Compare rugby and table tennis.", adjType: "long", reqAdj: ["more dangerous than"] },
    { id: 4, type: "comparative", target: "HEAVIER", desc: "Compare the big blue backpack and the small purple backpack.", adjType: "short", reqAdj: ["heavier than"] },
    { id: 5, type: "comparative", target: "BIGGER", desc: "Compare the main swimming pool and the small inflatable pool.", adjType: "short", reqAdj: ["bigger than"] },
    
    // SUPERLATIVES
    { id: 6, type: "superlative", target: "THE MOST EXCITING", desc: "Describe football compared to the other sports.", adjType: "long", reqAdj: ["the most exciting"] },
    { id: 7, type: "superlative", target: "THE OLDEST", desc: "Describe the stone castle compared to the other buildings.", adjType: "short", reqAdj: ["the oldest"] },
    { id: 8, type: "superlative", target: "THE BEST", desc: "Describe the boy holding the gold trophy.", adjType: "irregular", reqAdj: ["the best"] },
    { id: 9, type: "superlative", target: "THE WORST", desc: "Describe Team C (0-5) compared to the other teams.", adjType: "irregular", reqAdj: ["the worst"] },
    { id: 10, type: "superlative", target: "THE FARTHEST", desc: "Describe Island A in relation to the house.", adjType: "irregular", reqAdj: ["the farthest", "the furthest"] }
  ];

  function renderSlots() {
    const container = document.getElementById('slots-container');
    slotsData.forEach(slot => {
      const card = document.createElement('div');
      card.className = 'slot-card';
      card.innerHTML = `
        <div class="slot-header">
          <span class="slot-title">Slot ${slot.id}: ${slot.type.toUpperCase()}</span>
          <span class="target-adj">Target: ${slot.target}</span>
        </div>
        <p class="prompt-desc">${slot.desc}</p>
        <input type="text" id="input-${slot.id}" placeholder="Type your full sentence here..." autocomplete="off">
        <button class="btn-check" onclick="checkGrammar(${slot.id})">Check Grammar</button>
        <div class="feedback-box" id="feedback-${slot.id}"></div>
      `;
      container.appendChild(card);
    });
  }

  function checkGrammar(id) {
    const slot = slotsData.find(s => s.id === id);
    const text = document.getElementById(`input-${id}`).value.trim();
    const feedbackEl = document.getElementById(`feedback-${id}`);
    
    feedbackEl.style.display = 'block';
    
    if (!text) {
      feedbackEl.className = 'feedback-box error';
      feedbackEl.innerHTML = '⚠️ Please write a sentence before checking.';
      return;
    }

    const textLower = text.toLowerCase();

    // Component Checks
    const hasToBe = /\b(is|are|was|were)\b/.test(textLower);
    const hasTargetAdj = slot.reqAdj.some(adj => textLower.includes(adj));
    
    let hasStructure = false;
    if (slot.type === "comparative") {
      hasStructure = textLower.includes("than");
    } else if (slot.type === "superlative") {
      hasStructure = textLower.includes("the");
    }

    // Build Diagnostic Checklist
    let checks = [];
    
    if (hasToBe) {
      checks.push("✔️ Verb 'to be' (is/are) detected.");
    } else {
      checks.push("❌ Missing Verb 'to be' (use 'is' or 'are').");
    }

    if (hasTargetAdj) {
      checks.push(`✔️ Correct ${slot.type} adjective form used.`);
    } else {
      checks.push(`❌ Missing or incorrect target adjective (Expected: "${slot.reqAdj.join('" or "')}").`);
    }

    if (slot.type === "comparative" && !textLower.includes("than")) {
      checks.push("❌ Missing comparative connector 'than'.");
    }
    if (slot.type === "superlative" && !textLower.includes("the")) {
      checks.push("❌ Missing article 'the' before superlative adjective.");
    }

    const isFullyCorrect = hasToBe && hasTargetAdj && hasStructure;

    if (isFullyCorrect) {
      feedbackEl.className = 'feedback-box success';
      feedbackEl.innerHTML = `<strong>🎉 Excellent! All grammatical components detected:</strong><ul class="checklist">${checks.map(c => `<li>${c}</li>`).join('')}</ul>`;
    } else {
      feedbackEl.className = 'feedback-box error';
      feedbackEl.innerHTML = `<strong>⚠️ Grammar incomplete. Check your structure:</strong><ul class="checklist">${checks.map(c => `<li>${c}</li>`).join('')}</ul>`;
    }
  }

  renderSlots();
</script>

</body>
</html>
