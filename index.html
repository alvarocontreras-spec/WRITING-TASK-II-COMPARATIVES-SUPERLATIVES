<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparatives & Superlatives Practice</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #6c5ce7;
      --primary-hover: #5b4bc4;
      --text: #2d3436;
      --success: #00b894;
      --error: #d63031;
      --accent: #a29bfe;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      max-width: 650px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #636e72;
      font-size: 0.95em;
      margin-bottom: 25px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .score {
      font-weight: bold;
      color: #2d3436;
    }
    .question-box {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 10px;
      border: 2px solid #e9ecef;
      text-align: center;
    }
    .prompt-text {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 1.05em;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .feedback {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
      font-size: 1.05em;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Comparatives & Superlatives</h1>
  <p class="subtitle">Complete the sentences based on the visual examples.</p>

  <div class="header-bar">
    <span style="font-size: 0.9em; color: #636e72;" id="progress">Question 1 of 10</span>
    <span class="score">Score: <span id="score">0</span></span>
  </div>

  <div class="question-box">
    <p class="prompt-text" id="prompt"></p>
    <input type="text" id="answer" placeholder="Type your answer here..." autocomplete="off">
    <button onclick="checkAnswer()">Submit Answer</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<script>
  const questions = [
    // Comparatives
    { prompt: "A motorbike is ____________ a bicycle. (fast)", answer: "faster than" },
    { prompt: "Basic math (2 + 3) is ____________ complex algebra. (easy)", answer: "easier than" },
    { prompt: "Rugby is ____________ table tennis. (dangerous)", answer: "more dangerous than" },
    { prompt: "The big blue backpack is ____________ the small purple backpack. (heavy)", answer: "heavier than" },
    { prompt: "The main swimming pool is ____________ the inflatable pool. (big)", answer: "bigger than" },
    
    // Superlatives
    { prompt: "Football is ____________ sport of all three. (exciting)", answer: "the most exciting" },
    { prompt: "The stone castle is ____________ building in the town. (old)", answer: "the oldest" },
    { prompt: "The boy with the trophy in the middle is ____________ player. (good)", answer: "the best" },
    { prompt: "Team C has 0 points, so they are ____________ team. (bad)", answer: "the worst" },
    { prompt: "Island A is ____________ island from the house. (far)", answer: "the farthest" }
  ];

  let currentQ = 0;
  let score = 0;

  function loadQuestion() {
    if (currentQ < questions.length) {
      document.getElementById('progress').innerText = `Question ${currentQ + 1} of ${questions.length}`;
      document.getElementById('prompt').innerText = questions[currentQ].prompt;
      document.getElementById('answer').value = '';
      document.getElementById('feedback').innerText = '';
    } else {
      document.getElementById('progress').innerText = "Completed!";
      document.getElementById('prompt').innerText = "🎉 Excellent work! You completed the quiz.";
      document.getElementById('answer').style.display = 'none';
      document.querySelector('button').style.display = 'none';
      document.getElementById('feedback').innerText = `Final Score: ${score} / ${questions.length}`;
      document.getElementById('feedback').style.color = 'var(--primary)';
    }
  }

  function checkAnswer() {
    const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
    const correctAnswer = questions[currentQ].answer.toLowerCase();

    // Acepta "the furthest" además de "the farthest" para la última pregunta
    const isCorrect = (userAnswer === correctAnswer) || 
                      (questions[currentQ].answer === "the farthest" && userAnswer === "the furthest");

    if (isCorrect) {
      document.getElementById('feedback').innerText = "Correct! 👏";
      document.getElementById('feedback').style.color = "var(--success)";
      score++;
      document.getElementById('score').innerText = score;
      currentQ++;
      setTimeout(loadQuestion, 1000);
    } else {
      document.getElementById('feedback').innerText = `Incorrect. Correct answer: "${questions[currentQ].answer}"`;
      document.getElementById('feedback').style.color = "var(--error)";
    }
  }

  document.getElementById('answer').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      checkAnswer();
    }
  });

  loadQuestion();
</script>

</body>
</html>
